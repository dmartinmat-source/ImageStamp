services:
  postgres:
    image: postgres:17-alpine
    container_name: imagestamp-postgres
    environment:
      POSTGRES_DB: imagestamp
      POSTGRES_USER: imagestamp
      POSTGRES_PASSWORD: imagestamp
    ports:
      - "15432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagestamp -d imagestamp"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: src/ImageStamp/Dockerfile
    container_name: imagestamp-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=imagestamp;Username=imagestamp;Password=imagestamp"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
